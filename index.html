<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Wallet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Snap a photo of a business card and it reads the name, company and contact details into a searchable wallet that syncs across your devices.">
<meta name="theme-color" content="#5647a8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Wallet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f2efe8;
    --surface: #ffffff;
    --surface-2: #e8e3d7;
    --border: #ddd6c6;
    --border-strong: #c8c0ab;
    --text: #221f18;
    --text-muted: #6d685a;
    --text-faint: #948d79;
    --accent: #5647a8;
    --accent-soft: #ece9f7;
    --accent-contrast: #ffffff;
    --good: #4f7d4a;
    --good-soft: #e5efe0;
    --danger: #ab4a3a;
    --danger-soft: #f5e5e1;
    --focus-ring: #5647a8;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161c;
      --surface: #201f27;
      --surface-2: #2a2833;
      --border: #383544;
      --border-strong: #4a4658;
      --text: #ece9f2;
      --text-muted: #a29eb0;
      --text-faint: #7b7689;
      --accent: #a99ae6;
      --accent-soft: #282152;
      --accent-contrast: #16112e;
      --good: #8cbf82;
      --good-soft: #1f2c1c;
      --danger: #dd8c7a;
      --danger-soft: #38241f;
      --focus-ring: #a99ae6;
    }
  }

  :root[data-theme="dark"] {
    --bg: #17161c;
    --surface: #201f27;
    --surface-2: #2a2833;
    --border: #383544;
    --border-strong: #4a4658;
    --text: #ece9f2;
    --text-muted: #a29eb0;
    --text-faint: #7b7689;
    --accent: #a99ae6;
    --accent-soft: #282152;
    --accent-contrast: #16112e;
    --good: #8cbf82;
    --good-soft: #1f2c1c;
    --danger: #dd8c7a;
    --danger-soft: #38241f;
    --focus-ring: #a99ae6;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .page { max-width: 680px; margin: 0 auto; padding: 52px 20px 96px; }

  header.masthead { margin-bottom: 22px; }
  .masthead-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 10px;
  }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin: 0;
  }
  .lang-toggle {
    display: inline-flex; border: 1px solid var(--border-strong);
    border-radius: 6px; overflow: hidden; flex-shrink: 0;
  }
  .lang-toggle button {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.03em;
    color: var(--text-muted); background: var(--surface); border: none;
    border-left: 1px solid var(--border-strong); padding: 5px 9px; cursor: pointer;
  }
  .lang-toggle button:first-child { border-left: none; }
  .lang-toggle button[data-active="true"] { background: var(--accent); color: var(--accent-contrast); }

  h1 {
    font-family: var(--font-display); font-optical-sizing: auto; font-weight: 600;
    font-size: 32px; letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance;
  }
  .subtitle { margin: 0; color: var(--text-muted); font-size: 14.5px; max-width: 56ch; }

  /* --- primary buttons --- */
  .primary {
    font-family: var(--font-body); font-weight: 600; font-size: 14.5px;
    color: var(--accent-contrast); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; padding: 10px 18px;
    cursor: pointer; white-space: nowrap; transition: opacity 0.15s ease;
  }
  .primary:hover { opacity: 0.9; }
  .primary.block { display: block; width: 100%; }

  .btn-sm {
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost {
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    color: var(--text-muted); background: transparent; border: none;
    cursor: pointer; padding: 6px 4px;
  }
  .btn-ghost:hover { color: var(--accent); }
  .danger-btn {
    font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
    color: var(--danger); background: var(--danger-soft);
    border: 1px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  .danger-btn:hover { border-color: var(--danger); }

  .field-label {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text-faint);
  }

  /* --- toolbar / search --- */
  .toolbar { display: flex; gap: 8px; margin: 22px 0 12px; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search {
    width: 100%; font-family: var(--font-body); font-size: 15px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 10px 34px 10px 13px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search::placeholder { color: var(--text-faint); }
  .search:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; display: grid; place-content: center;
    background: transparent; border: none; color: var(--text-faint);
    font-size: 15px; cursor: pointer; border-radius: 5px;
  }
  .search-clear:hover { color: var(--danger); }

  .sort-select {
    font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 8px 10px; cursor: pointer; outline: none;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .filter-pill {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em;
    color: var(--text-muted); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 999px;
    padding: 4px 11px; cursor: pointer;
  }
  .filter-pill[data-active="true"] { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

  /* --- card grid --- */
  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px; margin: 0; padding: 0; list-style: none;
  }
  .card-tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left;
    font: inherit; color: inherit; padding: 0; display: flex; flex-direction: column;
    transition: border-color 0.12s ease, transform 0.12s ease;
  }
  .card-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-tile:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .tile-img {
    width: 100%; aspect-ratio: 1.75 / 1; object-fit: cover;
    background: var(--surface-2); display: block;
  }
  .tile-img.placeholder {
    display: grid; place-content: center; color: var(--text-faint);
    font-family: var(--font-display); font-size: 30px; font-weight: 600;
  }
  .tile-body { padding: 10px 12px 12px; }
  .tile-name { font-weight: 700; font-size: 15px; color: var(--text); }
  .tile-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .tile-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tile-tag {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.03em;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 4px; padding: 1px 5px;
  }

  .empty-state { padding: 54px 4px; text-align: center; color: var(--text-faint); font-size: 14px; }
  .empty-state .glyph { font-size: 30px; margin-bottom: 10px; display: block; opacity: 0.5; }

  .count {
    font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; margin-top: 18px; display: block;
  }
  .count strong { color: var(--text); font-weight: 600; }

  /* --- capture view --- */
  .back-link {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-faint); background: none;
    border: none; cursor: pointer; padding: 4px 0; margin-bottom: 14px;
  }
  .back-link:hover { color: var(--accent); }

  .dropzone {
    border: 2px dashed var(--border-strong); border-radius: 14px;
    padding: 38px 20px; text-align: center; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .dz-glyph { font-size: 34px; display: block; margin-bottom: 10px; opacity: 0.6; }
  .dropzone .dz-main { font-weight: 600; font-size: 15px; }
  .dropzone .dz-hint { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

  .queue-tag {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
    margin: 14px 0 8px; display: block;
  }

  .capture-preview { margin: 14px 0; }
  .capture-preview img {
    width: 100%; border-radius: 12px; border: 1px solid var(--border);
    display: block; max-height: 300px; object-fit: contain; background: var(--surface-2);
  }

  .ocr-status {
    display: flex; align-items: center; gap: 10px; margin: 12px 0;
    font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
  }
  .ocr-bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .ocr-bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.25s ease; }

  .field-form { margin-top: 8px; }
  .field {
    display: grid; grid-template-columns: 92px 1fr; align-items: center;
    gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border);
  }
  .field label {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--text-faint);
  }
  .field input, .field textarea {
    width: 100%; font-family: var(--font-body); font-size: 14.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 8px 10px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 40px; }
  .field input:focus-visible, .field textarea:focus-visible {
    border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .raw-toggle {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-faint); background: none;
    border: none; cursor: pointer; padding: 10px 0 4px;
  }
  .raw-toggle:hover { color: var(--accent); }
  pre.raw-text {
    white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono);
    font-size: 11.5px; color: var(--text-muted); background: var(--surface-2);
    border-radius: 8px; padding: 12px; margin: 6px 0 0; max-height: 200px; overflow: auto;
  }

  .form-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

  /* --- detail view --- */
  .detail-img-wrap { margin: 6px 0 18px; }
  .detail-img-wrap img {
    width: 100%; max-height: 58vh; object-fit: contain; object-position: top;
    border-radius: 12px; border: 1px solid var(--border);
    display: block; cursor: zoom-in; background: var(--surface-2);
  }
  .detail-name { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0 0 2px; }
  .detail-role { color: var(--text-muted); font-size: 14.5px; margin: 0 0 16px; }

  .field-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 2px; border-bottom: 1px solid var(--border);
  }
  .fr-main { flex: 1; min-width: 0; }
  .fr-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-faint); display: block; margin-bottom: 1px;
  }
  .fr-value { font-size: 14.5px; color: var(--text); word-break: break-word; }
  .fr-value a { color: var(--accent); text-decoration: none; }
  .fr-value a:hover { text-decoration: underline; }
  .fr-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    width: 30px; height: 30px; display: grid; place-content: center;
    background: transparent; border: 1px solid var(--border); border-radius: 7px;
    color: var(--text-muted); cursor: pointer; font-size: 13px;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
  .detail-tag {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--accent);
    background: var(--accent-soft); border-radius: 5px; padding: 2px 8px;
  }
  .detail-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .detail-meta {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    margin-top: 16px;
  }

  /* --- lightbox --- */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.86);
    display: grid; place-content: center; padding: 20px; z-index: 60; cursor: zoom-out;
  }
  .lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }

  /* --- transfer / backup --- */
  details.transfer { margin-top: 26px; border-top: 1px solid var(--border); padding-top: 14px; }
  details.transfer summary {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-faint); cursor: pointer; list-style: none;
  }
  details.transfer summary::-webkit-details-marker { display: none; }
  details.transfer summary::before { content: "+ "; }
  details.transfer[open] summary::before { content: "\2212 "; }
  .transfer-body { margin-top: 12px; }
  .transfer-body p { margin: 0 0 8px; font-size: 12.5px; color: var(--text-muted); }
  textarea.io {
    width: 100%; min-height: 90px; font-family: var(--font-mono); font-size: 11.5px;
    color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 10px; outline: none; resize: vertical;
  }
  textarea.io:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-soft); }
  .transfer-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease; z-index: 70;
    max-width: 84vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  button:focus-visible, a:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus-ring); outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <div class="masthead-top">
      <p class="eyebrow" id="eyebrow"></p>
      <div class="lang-toggle" id="lang-toggle" role="group">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ko">한국어</button>
      </div>
    </div>
    <h1 id="app-title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <!-- ============ LIST VIEW ============ -->
  <section id="view-list">
    <button type="button" class="primary block" id="add-card-btn"></button>

    <div class="toolbar">
      <div class="search-wrap">
        <input type="search" class="search" id="search" autocomplete="off">
        <button type="button" class="search-clear" id="search-clear" hidden aria-label="clear">✕</button>
      </div>
      <select class="sort-select" id="sort-select">
        <option value="recent"></option>
        <option value="name"></option>
        <option value="company"></option>
      </select>
    </div>

    <div class="filters" id="filters" hidden></div>

    <ul class="card-grid" id="card-grid"></ul>
    <div class="empty-state" id="empty-state" hidden>
      <span class="glyph">🪪</span>
      <span id="empty-text"></span>
    </div>
    <span class="count" id="count"></span>

    <details class="transfer">
      <summary id="transfer-summary"></summary>
      <div class="transfer-body">
        <p id="transfer-desc"></p>
        <textarea class="io" id="io-box" spellcheck="false"></textarea>
        <div class="transfer-actions">
          <button type="button" class="btn-sm" id="export-btn"></button>
          <button type="button" class="btn-sm" id="import-btn"></button>
          <button type="button" class="btn-sm" id="vcf-all-btn"></button>
        </div>
      </div>
    </details>
  </section>

  <!-- ============ CAPTURE / EDIT VIEW ============ -->
  <section id="view-capture" hidden>
    <button type="button" class="back-link" id="cap-back"></button>
    <h2 id="cap-title" style="font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 14px;"></h2>

    <div id="dropzone" class="dropzone">
      <span class="dz-glyph">📇</span>
      <span class="dz-main" id="dz-main"></span>
      <span class="dz-hint" id="dz-hint"></span>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment" multiple hidden>
    <button type="button" class="btn-ghost" id="manual-btn" style="margin-top:10px;"></button>

    <span class="queue-tag" id="queue-tag" hidden></span>

    <div class="capture-preview" id="capture-preview" hidden><img id="preview-img" alt=""></div>

    <div class="ocr-status" id="ocr-status" hidden>
      <span id="ocr-label"></span>
      <span class="ocr-bar"><span class="ocr-bar-fill" id="ocr-bar-fill"></span></span>
    </div>

    <form class="field-form" id="field-form" autocomplete="off" hidden>
      <div class="field"><label id="l-name"></label><input type="text" id="f-name" maxlength="80"></div>
      <div class="field"><label id="l-title"></label><input type="text" id="f-title" maxlength="80"></div>
      <div class="field"><label id="l-company"></label><input type="text" id="f-company" maxlength="120"></div>
      <div class="field"><label id="l-dept"></label><input type="text" id="f-dept" maxlength="120"></div>
      <div class="field"><label id="l-mobile"></label><input type="text" id="f-mobile" inputmode="tel" maxlength="40"></div>
      <div class="field"><label id="l-phone"></label><input type="text" id="f-phone" inputmode="tel" maxlength="40"></div>
      <div class="field"><label id="l-fax"></label><input type="text" id="f-fax" inputmode="tel" maxlength="40"></div>
      <div class="field"><label id="l-email"></label><input type="text" id="f-email" inputmode="email" maxlength="120"></div>
      <div class="field"><label id="l-website"></label><input type="text" id="f-website" maxlength="160"></div>
      <div class="field"><label id="l-address"></label><textarea id="f-address" maxlength="240" rows="2"></textarea></div>
      <div class="field"><label id="l-tags"></label><input type="text" id="f-tags" maxlength="160"></div>
      <div class="field"><label id="l-note"></label><textarea id="f-note" maxlength="400" rows="2"></textarea></div>

      <button type="button" class="raw-toggle" id="raw-toggle" hidden></button>
      <pre class="raw-text" id="raw-text" hidden></pre>

      <div class="form-actions">
        <button type="submit" class="primary" id="save-card-btn"></button>
        <button type="button" class="btn-sm" id="skip-card-btn" hidden></button>
        <button type="button" class="btn-sm" id="cancel-card-btn"></button>
      </div>
    </form>
  </section>

  <!-- ============ DETAIL VIEW ============ -->
  <section id="view-detail" hidden>
    <button type="button" class="back-link" id="det-back"></button>
    <div class="detail-img-wrap" id="detail-img-wrap" hidden><img id="detail-img" alt=""></div>
    <h2 class="detail-name" id="detail-name"></h2>
    <p class="detail-role" id="detail-role"></p>
    <div id="detail-fields"></div>
    <div class="detail-tags" id="detail-tags" hidden></div>
    <div class="detail-actions">

    $("field-form").hidden = false;

    $("preview-img").src = item.dataURL;

    // build stored images

          website: "website", address: "address", notes: "note"

        Object.keys(map).forEach(function (k) {
          var v = (fields[k] || "").trim();

  /* ---------- live sync ---------- */
  var syncActive = false;
  var syncApi = null;
  var myRev = null;
  var reconciled = false;
  var pushTimer = null;

  function syncPayloadCards() {
    // drop the inline photo only when it already lives in Storage (imageURL set);
    // otherwise the inline medium copy is how the photo reaches other devices.
    return cards.map(function (c) {
      var o = Object.assign({}, c);
      if (o.imageURL) o.img = "";
      return o;
    });
  }
  function schedulePush() {
    if (!syncApi) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushRemote, 700);
  }
  function pushRemote() {
    if (!syncApi) return;
    var rev = makeId();
    myRev = rev;
    var attempt = syncApi.push({ cards: syncPayloadCards(), rev: rev, updatedAt: Date.now() });
    if (attempt && typeof attempt.catch === "function") {
      attempt.catch(function () { clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, 4000); });
    }
  }
  function mergeById(remoteList, localList) {
    var out = [], seen = {};
    (remoteList || []).forEach(function (c) { if (c && c.id) { seen[c.id] = c; out.push(normalizeCard(c)); } });
    (localList || []).forEach(function (c) {
      if (!c || !c.id) return;
      if (!seen[c.id]) { out.push(c); return; }
    });
    // prefer newer updatedAt when an id is on both sides
    var byId = {};
    out.forEach(function (c) { byId[c.id] = c; });
    (localList || []).forEach(function (c) {
      if (c && c.id && byId[c.id] && (c.updatedAt || 0) > (byId[c.id].updatedAt || 0)) {
        var keepImg = byId[c.id].img || c.img;
        Object.assign(byId[c.id], c);
        if (!byId[c.id].imageURL && !byId[c.id].img) byId[c.id].img = keepImg;
      }
    });
    return out;
  }
  function adoptRemote(d) {
    var incoming = (d.cards || []).map(normalizeCard);
    // carry over an inline photo we still hold if the remote copy lost it
    var mine = {};
    cards.forEach(function (c) { mine[c.id] = c; });
    incoming.forEach(function (c) {
      if (!c.img && !c.imageURL && mine[c.id] && mine[c.id].img) c.img = mine[c.id].img;
    });
    cards = incoming;
    saveLocal();
    renderList();
    if (view === "detail" && currentId) openDetail(currentId);
  }
  function onRemote(d) {
    var goLive = function () { if (!syncActive) { syncActive = true; applyLang(); } };

    if (d === null || d === undefined || typeof d !== "object") {
      reconciled = true; goLive();
      if (cards.length) pushRemote();
      return;
    }
    if (d.rev && d.rev === myRev) { reconciled = true; goLive(); return; }

    var remoteCards = Array.isArray(d.cards) ? d.cards : [];
    if (!reconciled) {
      reconciled = true;
      if (cards.length && remoteCards.length) {
        cards = mergeById(remoteCards, cards);
        saveLocal(); renderList(); pushRemote();
      } else if (remoteCards.length) {
        adoptRemote(d);
      } else if (cards.length) {
        pushRemote();
      }
      goLive();
      return;
    }
    adoptRemote(d);
    goLive();
  }
  function setupSync(api) {
    syncApi = api;
    api.ready.then(function (ok) {
      if (!ok) { syncApi = null; return; }
      api.subscribe(onRemote);
    }).catch(function () { syncApi = null; });
  }
  function whenSyncDecided(cb) {
    if (window.CW_SYNC_DECIDED) { cb(window.CW_SYNC || null); return; }
    var done = false;
    var fire = function () { if (done) return; done = true; cb(window.CW_SYNC || null); };
    window.addEventListener("cw-sync-decided", fire, { once: true });
    setTimeout(fire, 12000);
  }

    setText("cap-back", T("back"));
    setText("det-back", T("back"));
    setText("cap-title", T(editingId ? "capTitleEdit" : "capTitleNew"));
    setText("l-name", T("lName")); setText("l-title", T("lTitle")); setText("l-company", T("lCompany"));
    setText("l-dept", T("lDept")); setText("l-mobile", T("lMobile")); setText("l-phone", T("lPhone"));
    setText("l-fax", T("lFax")); setText("l-email", T("lEmail")); setText("l-website", T("lWebsite"));
    setText("l-address", T("lAddress")); setText("l-tags", T("lTags")); setText("l-note", T("lNote"));
    $("f-tags").placeholder = T("tagsHint");
    $("raw-toggle").textContent = $("raw-text").hidden ? T("rawShow") : T("rawHide");
    setText("cancel-card-btn", T("cancel"));
    setText("det-edit", T("detEdit")); setText("det-vcf", T("detVcf"));
    setText("det-delete", deleteArmed ? T("deleteArm") : T("detDelete"));
    setText("transfer-summary", T("transferSummary"));
    setText("transfer-desc", T("transferDesc"));
    setText("export-btn", T("fill"));
    $("import-btn").textContent = importArmed ? T("importArm") : T("importBtn");
    setText("vcf-all-btn", T("vcfAll"));
    updateQueueTag();

    $("lang-toggle").querySelectorAll("button").forEach(function (b) {
      b.setAttribute("data-active", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    $("lang-toggle").setAttribute("aria-label", T("langGroup"));

    if (view === "list") renderList();
    else if (view === "detail" && currentId) openDetail(currentId);
  }
  $("lang-toggle").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    lang = b.getAttribute("data-lang") === "ko" ? "ko" : "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
    applyLang();
  });

  /* ---------- init ---------- */
  registerServiceWorker();
  show("list");
  applyLang();
  renderList();
  whenSyncDecided(function (api) { if (api) setupSync(api); });
})();
</script>

</body>
</html>
